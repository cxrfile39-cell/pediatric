name: Weekly update & deploy

on:
  # 每週一 08:00 台灣時間（= 週一 00:00 UTC）
  schedule:
    - cron: "0 0 * * 1"
  # 第一次上傳檔案（push）就會自動執行，不需手動啟動
  push:
    branches: [main, master]
    paths-ignore:
      - "data/**"
      - "site/data.json"
      - "site/archive/**"
      - "README.md"
  # 保留手動按鈕，需要時可用
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest PubMed articles
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          RUN_EVENT: ${{ github.event_name }}
          MAX_PER_SPECIALTY: "80"
          POOL_PER_SPECIALTY: "1000"
          BACKFILL_WEEKS: "104"      # 回補 2 年
          BACKFILL_MINUTES: "240"    # 單次回補上限，未完成下次接續
        run: python scripts/fetch_pubmed.py

      - name: Commit data (keeps the repo active so the weekly schedule stays on)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data.json site/archive
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Weekly update $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash || true
            git push || echo "Push failed; deploy continues"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
