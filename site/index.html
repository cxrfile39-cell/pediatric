<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>兒科次專科最新文獻週報 | Pediatric Literature Weekly</title>
<meta name="description" content="依兒科次專科分類，每週一自動更新 PubMed 最新 journal article、review 與 guideline。">
<style>
  :root{
    --c1:#12355B;          /* 主色：深海軍藍 */
    --c2:#E4572E;          /* 輔色：珊瑚橘 */
    --c1-soft:#E8EEF5;
    --c2-soft:#FCEBE5;
    --ink:#1B2430; --muted:#5B6675; --line:#D9E0E8; --bg:#F6F8FB;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
       color:var(--ink);background:var(--bg);line-height:1.55}
  a{color:var(--c1)}
  header{background:var(--c1);color:#fff;padding:28px 20px 22px;border-bottom:6px solid var(--c2)}
  .wrap{max-width:1180px;margin:0 auto}
  header h1{margin:0;font-size:clamp(1.35rem,3.2vw,2rem);letter-spacing:.02em}
  header h1 span{color:var(--c2)}
  header p{margin:.4rem 0 0;opacity:.88;font-size:.95rem}
  .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:.88rem}
  .meta b{color:#fff;background:var(--c2);padding:1px 8px;border-radius:4px;font-weight:600}
  main{display:grid;grid-template-columns:300px 1fr;gap:22px;padding:22px 20px 40px}
  @media (max-width:860px){main{grid-template-columns:1fr}}
  aside{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;align-self:start;position:sticky;top:12px;
        max-height:calc(100vh - 24px);overflow:auto}
  @media (max-width:860px){aside{position:static;max-height:none}}
  aside h2{font-size:.95rem;margin:0 0 10px;color:var(--c1);border-left:4px solid var(--c2);padding-left:8px}
  .btns{display:flex;gap:8px;margin-bottom:10px}
  button{font:inherit;cursor:pointer;border-radius:6px;padding:6px 12px;border:1.5px solid var(--c1);background:#fff;color:var(--c1);font-weight:600;font-size:.86rem}
  button.primary{background:var(--c1);color:#fff}
  button:hover{border-color:var(--c2);color:var(--c2)}
  button.primary:hover{background:var(--c2);color:#fff}
  .list label{display:flex;align-items:flex-start;gap:8px;padding:5px 4px;border-radius:5px;font-size:.88rem;cursor:pointer}
  .list label:hover{background:var(--c1-soft)}
  .list input{accent-color:var(--c2);margin-top:3px}
  .list .n{margin-left:auto;color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
  .types{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}
  .types label{border:1.5px solid var(--c1);border-radius:999px;padding:3px 10px;font-size:.82rem;cursor:pointer;user-select:none;color:var(--c1)}
  .types input{display:none}
  .types label.on{background:var(--c1);color:#fff}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .toolbar input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;font:inherit}
  .toolbar input[type=search]:focus{outline:none;border-color:var(--c2)}
  select{font:inherit;padding:8px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
  .count{color:var(--muted);font-size:.9rem;margin-bottom:10px}
  .count b{color:var(--c2)}
  article.card{background:#fff;border:1px solid var(--line);border-left:5px solid var(--c1);border-radius:8px;padding:14px 16px;margin-bottom:12px}
  article.card.Guideline{border-left-color:var(--c2)}
  .card h3{margin:0 0 6px;font-size:1.02rem;line-height:1.4}
  .card h3 a{text-decoration:none;color:var(--ink)}
  .card h3 a:hover{color:var(--c2)}
  .sub{font-size:.85rem;color:var(--muted)}
  .sub i{color:var(--c1);font-style:normal;font-weight:600}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .tag{font-size:.74rem;padding:2px 8px;border-radius:4px;background:var(--c1-soft);color:var(--c1)}
  .tag.type{background:var(--c1);color:#fff;font-weight:600}
  .tag.type.Guideline{background:var(--c2)}
  .tag.type.Review{background:#fff;color:var(--c1);border:1px solid var(--c1)}
  details{margin-top:8px;font-size:.9rem}
  summary{cursor:pointer;color:var(--c2);font-weight:600}
  details p{white-space:pre-line;margin:.5rem 0 0;color:#2F3A47}
  .links{margin-top:8px;font-size:.84rem;display:flex;gap:14px}
  .empty{background:#fff;border:1px dashed var(--line);border-radius:8px;padding:30px;text-align:center;color:var(--muted)}
  footer{background:var(--c1);color:#fff;text-align:center;padding:20px;font-size:.88rem;border-top:6px solid var(--c2)}
  footer strong{color:var(--c2)}
  footer small{display:block;opacity:.75;margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>兒科次專科 <span>最新文獻週報</span></h1>
    <p>Pediatric Subspecialty Literature Weekly — 收錄 PubMed 最新 Journal Article / Review / Guideline</p>
    <div class="meta">
      <span>更新時間：<b id="updated">載入中…</b></span>
      <span>收錄範圍：近 <span id="days">7</span> 天</span>
      <span>下次更新：<b id="next">計算中…</b></span>
      <span>製作者：<b>JH CHIU MD</b> × Claude 5.5</span>
    </div>
  </div>
</header>

<main class="wrap">
  <aside>
    <h2>文章類型</h2>
    <div class="types" id="types"></div>
    <h2>次專科</h2>
    <div class="btns">
      <button class="primary" id="all">全選</button>
      <button id="none">全不選</button>
    </div>
    <div class="list" id="specs"></div>
  </aside>

  <section>
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜尋標題、期刊、作者、摘要…">
      <select id="sort">
        <option value="date">依出版日期</option>
        <option value="journal">依期刊名稱</option>
      </select>
    </div>
    <div class="count" id="count"></div>
    <div id="results"></div>
  </section>
</main>

<footer>
  製作者 <strong>JH CHIU MD</strong> · 協作 <strong>Claude 5.5</strong>
  <small>資料來源：NCBI PubMed E-utilities。本頁僅供學術參考，臨床決策請以原文及專業判斷為準。</small>
</footer>

<script>
const TYPES = ["Article", "Review", "Guideline"];
const TYPE_LABEL = {Article: "Journal Article", Review: "Review", Guideline: "Guideline"};
const state = {data: null, specs: new Set(), types: new Set(TYPES), q: "", sort: "date"};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function load() {
  try { const s = JSON.parse(localStorage.getItem("pedslit") || "null");
        if (s) { state.savedSpecs = s.specs; state.types = new Set(s.types); } } catch (e) {}
}
function save() {
  try { localStorage.setItem("pedslit", JSON.stringify({specs: [...state.specs], types: [...state.types]})); } catch (e) {}
}

function buildFilters() {
  const d = state.data;
  const perSpec = {};
  d.articles.forEach(a => a.specialties.forEach(s => perSpec[s] = (perSpec[s] || 0) + 1));
  const known = new Set(d.specialties);
  state.specs = new Set(state.savedSpecs ? state.savedSpecs.filter(s => known.has(s)) : d.specialties);
  $("specs").innerHTML = d.specialties.map((s, i) => `
    <label><input type="checkbox" data-spec="${esc(s)}" ${state.specs.has(s) ? "checked" : ""}>
      <span>${esc(s)}</span><span class="n">${perSpec[s] || 0}</span></label>`).join("");
  $("specs").addEventListener("change", e => {
    const s = e.target.dataset.spec; if (!s) return;
    e.target.checked ? state.specs.add(s) : state.specs.delete(s); save(); render();
  });
  $("types").innerHTML = TYPES.map(t => `
    <label class="${state.types.has(t) ? "on" : ""}"><input type="checkbox" data-type="${t}" ${state.types.has(t) ? "checked" : ""}>${TYPE_LABEL[t]}</label>`).join("");
  $("types").addEventListener("change", e => {
    const t = e.target.dataset.type; if (!t) return;
    e.target.checked ? state.types.add(t) : state.types.delete(t);
    e.target.parentElement.classList.toggle("on", e.target.checked); save(); render();
  });
}

function setAll(on) {
  state.specs = new Set(on ? state.data.specialties : []);
  document.querySelectorAll("#specs input").forEach(i => i.checked = on);
  save(); render();
}

function render() {
  const q = state.q.trim().toLowerCase();
  let list = state.data.articles.filter(a =>
    state.types.has(a.type) &&
    a.specialties.some(s => state.specs.has(s)) &&
    (!q || [a.title, a.journal, a.abstract, a.authors.join(" ")].join(" ").toLowerCase().includes(q)));
  if (state.sort === "journal") list = [...list].sort((a, b) => a.journal.localeCompare(b.journal) || b.sortDate.localeCompare(a.sortDate));
  $("count").innerHTML = `顯示 <b>${list.length}</b> 篇（共 ${state.data.articles.length} 篇）`;
  if (!list.length) {
    $("results").innerHTML = `<div class="empty">${state.specs.size ? "沒有符合條件的文章" : "請至少勾選一個次專科"}</div>`;
    return;
  }
  $("results").innerHTML = list.map(a => `
    <article class="card ${a.type}">
      <h3><a href="https://pubmed.ncbi.nlm.nih.gov/${a.pmid}/" target="_blank" rel="noopener">${esc(a.title)}</a></h3>
      <div class="sub"><i>${esc(a.journal)}</i> · ${esc(a.date)} · ${esc(a.authors.join(", "))}</div>
      <div class="tags">
        <span class="tag type ${a.type}">${TYPE_LABEL[a.type]}</span>
        ${a.specialties.map(s => `<span class="tag">${esc(s)}</span>`).join("")}
      </div>
      ${a.abstract ? `<details><summary>摘要 Abstract</summary><p>${esc(a.abstract)}</p></details>` : ""}
      <div class="links">
        <a href="https://pubmed.ncbi.nlm.nih.gov/${a.pmid}/" target="_blank" rel="noopener">PubMed ${a.pmid}</a>
        ${a.doi ? `<a href="https://doi.org/${esc(a.doi)}" target="_blank" rel="noopener">全文 DOI</a>` : ""}
      </div>
    </article>`).join("");
}

// 下次更新：下一個週一 00:00 UTC（= 台灣時間週一 08:00）
function nextUpdate() {
  const now = new Date();
  const n = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
  let add = (1 - n.getUTCDay() + 7) % 7;
  if (add === 0 && now >= n) add = 7;
  n.setUTCDate(n.getUTCDate() + add);
  const tw = new Date(n.getTime() + 8 * 3600e3);
  const p = x => String(x).padStart(2, "0");
  return `${tw.getUTCFullYear()}-${p(tw.getUTCMonth() + 1)}-${p(tw.getUTCDate())}（週一）08:00 (UTC+8)`;
}
$("next").textContent = nextUpdate();

load();
fetch("data.json", {cache: "no-store"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    state.data = d;
    $("updated").textContent = d.updated;
    $("days").textContent = d.daysBack;
    buildFilters(); render();
  })
  .catch(() => {
    $("updated").textContent = "尚無資料";
    $("results").innerHTML = '<div class="empty">資料尚未產生。GitHub Actions 首次執行完成後即會顯示。</div>';
  });
$("all").onclick = () => setAll(true);
$("none").onclick = () => setAll(false);
$("q").addEventListener("input", e => { state.q = e.target.value; if (state.data) render(); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; if (state.data) render(); });
</script>
</body>
</html>
